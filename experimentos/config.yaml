# Configuração do experimento principal (experimentos/principal.py)

dataset:
  path: "data/breast-cancer.csv"   # CSV do Kaggle (uciml/breast-cancer-wisconsin-data)
  test_size: 0.2
  random_state: 42

# Validação: StratifiedKFold de 10 folds no treino + Grid Search,
# métrica = acurácia balanceada (como no artigo)
cross_validation:
  n_splits: 10
  shuffle: true
  random_state: 42
  scoring: "balanced_accuracy"

# ---- MOL ----
mol:
  # Estágio Map: euclidean, anova, pearson, fisher, gain_ratio, mutual_info, random_forest
  map_strategies: ["euclidean", "anova", "fisher", "gain_ratio", "mutual_info"]
  # Estágio Optimize: pso, epso, abc (random = busca aleatória, só referência)
  optimizers: ["pso", "epso", "abc"]
  n_population: 50          # artigo: 50
  max_evaluations: 500      # artigo: 500 avaliações
  sample_order: "class"     # ordem das amostras na Eq. (1): class | original
  min_pixels: 2             # restrição 2 <= h*w (artigo: 2)
  scaler: "standard"        # standard | minmax
  # Estágio Learn (CNN do artigo: 1 conv 32 filtros + 1 max-pooling)
  cnn:
    epochs: 100
    batch_size: 32
    early_stopping: false
    learning_rate_grid: [0.1, 0.01, 0.001, 0.0001]   # artigo: 1e-1 a 1e-4

# ---- BASELINES ----
baselines:
  fs_strategies: ["S", "E", "W"]   # S = sem FS, E = embedded, W = wrapper (RFE)
  rfe_step: 0.1                    # fração de features removidas por iteração do RFE
  grid_set: "quick"                # quick (minutos) | paper (grids da Tabela III, horas)

  grids:
    paper:
      rfe_n_features: [5, 10, 15]
      ANN:
        solver: ["lbfgs", "adam"]
        learning_rate_init: {logspace: [-1, -10, 10]}
        hidden_layer_sizes: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
      KNN:
        n_neighbors: [2, 3, 4, 5, 6, 7, 8, 9, 10]
        metric: ["euclidean", "manhattan"]
        weights: ["uniform", "distance"]
      LR:
        l1_ratio: [0, 1]                 # 0 = L2, 1 = L1
        C: {logspace: [-4, 4, 20]}
      RF:
        max_features: [1, 3, 10]
        min_samples_split: [2, 3, 10]
        min_samples_leaf: [1, 3, 10]
        n_estimators: [100, 300, 500]
      XGB:
        gamma: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
        subsample: [0.6, 0.8, 1.0]
        colsample_bytree: [0.6, 0.8, 1.0]
        max_depth: [2, 3, 4, 5]
      LGBM:
        num_leaves: [31, 127]
        min_child_samples: [30, 50, 100, 300, 400]
        reg_alpha: [0.1, 1, 1.5]
        reg_lambda: [0.1, 1, 1.5]

    quick:
      rfe_n_features: [5, 10, 15]
      ANN:
        solver: ["lbfgs", "adam"]
        learning_rate_init: [0.01, 0.001]
        hidden_layer_sizes: [5, 15, 30]
      KNN:
        n_neighbors: [3, 5, 7, 9]
        metric: ["euclidean", "manhattan"]
        weights: ["uniform", "distance"]
      LR:
        l1_ratio: [0, 1]
        C: {logspace: [-4, 4, 9]}
      RF:
        max_features: [3, 10]
        min_samples_leaf: [1, 3]
        n_estimators: [100, 300]
      XGB:
        gamma: [0.5, 1.5]
        subsample: [0.8, 1.0]
        max_depth: [2, 4]
      LGBM:
        num_leaves: [31]
        min_child_samples: [30, 100]
        reg_lambda: [0.1, 1.5]

# ---- SAÍDA ----
output:
  results_dir: "results/principal"
  n_images_per_class: 10
